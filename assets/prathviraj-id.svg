<svg xmlns="http://www.w3.org/2000/svg" width="340" height="660" viewBox="0 0 340 660" role="img" aria-label="Prathviraj swinging ID badge" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2540"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7928ca"/>
      <stop offset="1" stop-color="#2afadf"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- whole badge swings from the top pivot -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-5 170 0; 5 170 0; -5 170 0" keyTimes="0; 0.5; 1"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
      dur="5s" repeatCount="indefinite"/>

    <!-- lanyard strap -->
    <rect x="150" y="-20" width="40" height="300" fill="url(#strap)"/>
    <line x1="170" y1="-20" x2="170" y2="280" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>

    <!-- metal clip -->
    <rect x="146" y="268" width="48" height="38" rx="9" fill="url(#metal)"/>
    <circle cx="170" cy="287" r="6" fill="#0b1020"/>
    <rect x="161" y="300" width="18" height="42" rx="5" fill="#64748b"/>

    <!-- card glow + body -->
    <rect x="50" y="332" width="240" height="302" rx="26" fill="#6366f1" opacity="0.55" filter="url(#glow)"/>
    <rect x="50" y="332" width="240" height="302" rx="26" fill="url(#cardbg)" stroke="url(#edge)" stroke-width="5"/>

    <!-- header -->
    <text x="170" y="368" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#2afadf" letter-spacing="3.5">SOFTWARE ENGINEER</text>
    <text x="170" y="384" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#64748b" letter-spacing="2.5">ACCESS: JAVA BACKEND</text>

    <!-- avatar -->
    <circle cx="170" cy="438" r="44" fill="url(#avatar)" stroke="#e2e8f0" stroke-width="3"/>
    <text x="170" y="466" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="bold" fill="#ffffff">P</text>

    <!-- name -->
    <text x="170" y="515" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="2">PRATHVIRAJ</text>
    <text x="170" y="534" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8" letter-spacing="1.5">B.E. ECE · BKIT · 2026</text>

    <line x1="74" y1="546" x2="266" y2="546" stroke="#334155" stroke-width="1"/>

    <!-- stack -->
    <text x="74" y="562" font-family="'Courier New', monospace" font-size="9" fill="#64748b" letter-spacing="2">STACK</text>
    <text x="74" y="577" font-family="'Courier New', monospace" font-size="10.5" fill="#e6edf3">Java 21 · Spring Boot · JWT</text>
    <text x="74" y="591" font-family="'Courier New', monospace" font-size="10.5" fill="#e6edf3">MySQL · Redis · Docker</text>

    <!-- status -->
    <circle cx="78" cy="602" r="3.5" fill="#00ff88"/>
    <text x="88" y="605" font-family="'Courier New', monospace" font-size="9" fill="#00ff88" letter-spacing="1.5">OPEN TO OPPORTUNITIES</text>
  </g>
</svg>
